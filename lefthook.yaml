templates:
  # This hooks require uv to run
  run_python: 'uv run'

pre-commit:
  parallel: true
  jobs:
    - name: 'EditorConfig'
      glob: '*.rst'
      run: 'ec {staged_files}'
    - name: 'Ruff'
      glob: '*.py'
      group:
        parallel: false
        jobs:
          - name: format
            run: '{run_python} ruff format {staged_files}'
            stage_fixed: true
          - name: lint
            run: '{run_python} ruff check --fix {staged_files}'
            stage_fixed: true
    - name: 'Pyrefly'
      glob: '*.py'
      run: '{run_python} pyrefly check {staged_files}'
    - name: 'reStructuredText'
      glob: '*.rst'
      run: 'uv run restructuredtext-lint {staged_files}'
