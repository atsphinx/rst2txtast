name: 'Run CI jobs'

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'
  pull_request:
  workflow_dispatch:

env:
  UV_NO_SYNC: 1
  GH_TOKEN: ${{ github.token }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: aquaproj/aqua-installer@96a9bc20066c5bf5e275b41019cfc165b25f4e2e # v4.0.5
        with:
          aqua_version: v2.55.3
      - name: 'Configure dependencies'
        run: |
          uv sync --frozen --all-extras
      - name: 'Run linters'
        run: |
          uv run lefthook run pre-commit --all-files
  test:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
        workspace: ["locked", "latest"]
    steps:
      - uses: actions/checkout@v5
      - uses: aquaproj/aqua-installer@96a9bc20066c5bf5e275b41019cfc165b25f4e2e # v4.0.5
        with:
          aqua_version: v2.55.3
      - name: "Set up workspace"
        run: |
          echo '${{ matrix.python-version }}' > .python-version
      - name: "Configure env as locked deps by uv.lock"
        run: |
          uv sync --all-extras --frozen
        if: ${{ matrix.workspace == 'locked'}}
      - name: "Configure env as latest deps on PyPI"
        run: |
          uv sync --all-extras --upgrade
        if: ${{ matrix.workspace == 'latest'}}
      - name: 'Run unittest'
        run: |
          uv run pytest
