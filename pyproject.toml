[project]
name = "rst2txtast"
version = "0.2.0"
description = "TxtAST Writer for docutils"
readme = "README.rst"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Kazuya Takei", email = "me@attakei.net" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Documentation",
    "Topic :: Text Processing :: Markup :: reStructuredText",
]
requires-python = ">=3.10"
dependencies = [
    "docutils>=0.18",
]

[project.scripts]
rst2txtast = "rst2txtast.cmd:run"
rst2ast = "rst2txtast.compat:run"

[project.urls]
"Source Code" = "https://github.com/atsphinx/rst2txtast"
Changelog = "https://github.com/atsphinx/rst2txtast/blob/main/CHANGES.rst"
"Original project" = "https://pypi.org/project/docutils-ast-writer"
"Original source" = "https://github.com/jimo1001/docutils-ast-writer"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "deepdiff>=9.1.0",
    "pyrefly>=0.14.0",
    "pytest>=7.4.4",
    "restructuredtext-lint>=2.0.2",
    "ruff>=0.16.0",
]

[tool.ruff.lint]
select = ["C90", "E", "F", "I", "UP", "W"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"
