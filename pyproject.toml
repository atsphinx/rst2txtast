[project]
name = "rst2txtast"
version = "0.1.0"
description = "TxtAST Writer for docutils"
readme = "README.rst"
license = "MIT"
authors = [
    { name = "jimo1001", email = "jimo1001@gmail.com" },
]
maintainers = [
    { name = "Shiguredo Inc." },
    { name = "Kazuya Takei", email = "myself@attakei.net" }
]
requires-python = ">=3.10"
dependencies = [
    "docutils>=0.18",
]

[project.scripts]
rst2txtast = "rst2txtast.cmd:run"
rst2ast = "rst2txtast.compat:run"

[project.urls]
Repository = "https://github.com/atsphinx/rst2txtast"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "deepdiff>=6.7.1",
    "lefthook>=2.1.10",
    "pyrefly>=0.14.0",
    "pytest>=7.4.4",
    "restructuredtext-lint>=2.0.2",
    "ruff>=0.16.0",
]

[tool.ruff.lint]
select = ["C90", "E", "F", "I", "UP", "W"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"
